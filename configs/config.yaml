data:
  n_sku: 40
  start_date: "2022-01-01"
  end_date: "2024-12-31"
  seed: 42
  raw_path: "./data/raw"
  processed_path: "./data/processed"

hierarchy:
  regions: ["North", "South", "East", "West"]
  categories: ["Electronics", "Apparel", "Grocery"]

features:
  lags: [1, 7, 14, 28]
  rolling_windows: [7, 14, 28, 56]
  fourier_orders: [1, 2, 3]
  holiday_country: "US"

cv:
  n_folds: 4
  horizon: 28
  step: 28

models:
  lightgbm:
    n_estimators: 800
    learning_rate: 0.03
    num_leaves: 63
    min_child_samples: 20
    subsample: 0.9
    colsample_bytree: 0.9
    reg_alpha: 0.1
    reg_lambda: 0.1
  prophet:
    changepoint_prior_scale: 0.05
    seasonality_prior_scale: 10.0
  torch:
    hidden_dim: 128
    embedding_dim: 16
    epochs: 30
    batch_size: 512
    lr: 0.001

hierarchy_reconciliation:
  method: "mint_sample"   # ols | wls | mint_sample

inventory:
  service_level: 0.95
  lead_time_days: 7
  holding_cost_per_unit: 0.5
  stockout_cost_per_unit: 5.0
  review_period_days: 7
